name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }

      - name: Unit tests (core)
        run: gradle :core:test

      - name: Prepare keystore
        run: |
          keytool -genkeypair -v -keystore kal-release.jks -alias kal -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass kalkalkal -keypass kalkalkal -dname "CN=Kal"
          printf 'storeFile=kal-release.jks\nstorePassword=kalkalkal\nkeyAlias=kal\nkeyPassword=kalkalkal\n' > keystore.properties

      - name: Build debug + release APKs
        run: gradle :app:assembleDebug :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: kal-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
